# Schema, privilege, migration, live-dashboard, verifier and MCP server checks
# against every supported PostgreSQL major version. Nothing here needs MATLAB:
# the MATLAB tests in tests/matlab/ run locally only
# (design_docs/testing-locally.md).

name: tests
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      # The last commit whose schema.sql is version 1 (no lab.schema_version).
      # The migrations are checked by upgrading that schema with every
      # script in design_docs/migrations/ and comparing the result with a
      # fresh install of the current one.
      SCHEMA_V1_COMMIT: "1778007"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SCHEMA_V1_COMMIT must be reachable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the psql client and Python dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -e "mcp-server[test]" "ruff==0.15.20"

      - name: Lint Python
        run: ruff check mcp-server web/live tests tools

      - name: Apply schema.sql to a fresh database
        run: |
          createdb lab_test
          psql -X -q -v ON_ERROR_STOP=1 -d lab_test -f design_docs/schema.sql

      - name: Schema assertions
        run: psql -X -v ON_ERROR_STOP=1 -d lab_test -f tests/schema_test.sql

      - name: Grant script applies, twice
        run: |
          psql -X -q -v ON_ERROR_STOP=1 -d lab_test -f design_docs/grants.sql
          psql -X -q -v ON_ERROR_STOP=1 -d lab_test -f design_docs/grants.sql

      # schema_test.sql runs as the owner; this acts as members of lab_rw and
      # lab_ro, which is the only way to see what the grants actually allow.
      - name: Role and privilege assertions
        run: psql -X -v ON_ERROR_STOP=1 -d lab_test -f tests/roles_test.sql

      - name: v1 plus migrations matches a fresh install
        run: |
          git show "$SCHEMA_V1_COMMIT:design_docs/schema.sql" > "$RUNNER_TEMP/schema_v1.sql"
          createdb lab_fresh
          createdb lab_migrated
          psql -X -q -v ON_ERROR_STOP=1 -d lab_fresh -f design_docs/schema.sql
          psql -X -q -v ON_ERROR_STOP=1 -d lab_migrated -f "$RUNNER_TEMP/schema_v1.sql"
          for m in design_docs/migrations/*.sql; do
            echo "applying $m"
            psql -X -q -v ON_ERROR_STOP=1 -1 -d lab_migrated -f "$m"
          done
          # pg_dump runs inside the service container so its version matches
          # the server's; its \restrict / \unrestrict lines carry a random key.
          dump() {
            docker exec "${{ job.services.postgres.id }}" \
              pg_dump -U postgres --schema-only -d "$1" | grep -v '^\\\(un\)\?restrict '
          }
          dump lab_fresh > "$RUNNER_TEMP/fresh.sql"
          dump lab_migrated > "$RUNNER_TEMP/migrated.sql"
          diff -u "$RUNNER_TEMP/fresh.sql" "$RUNNER_TEMP/migrated.sql"
          psql -X -v ON_ERROR_STOP=1 -d lab_migrated -f tests/schema_test.sql
          psql -X -q -v ON_ERROR_STOP=1 -d lab_migrated -f design_docs/grants.sql
          psql -X -v ON_ERROR_STOP=1 -d lab_migrated -f tests/roles_test.sql

      # The comparison above upgrades an empty database. This upgrades one
      # that holds version-1 rows, including ones later versions would reject.
      - name: Migrations on a version-1 database with data
        run: |
          createdb lab_migrated_data
          psql -X -q -v ON_ERROR_STOP=1 -d lab_migrated_data -f "$RUNNER_TEMP/schema_v1.sql"
          psql -X -q -v ON_ERROR_STOP=1 -d lab_migrated_data -f tests/seed_v1.sql
          for m in design_docs/migrations/*.sql; do
            echo "applying $m"
            psql -X -q -v ON_ERROR_STOP=1 -1 -d lab_migrated_data -f "$m"
          done
          psql -X -v ON_ERROR_STOP=1 -d lab_migrated_data -f tests/migrated_data_test.sql

      - name: Artifact verifier, end to end
        run: |
          createdb lab_verify
          psql -X -q -v ON_ERROR_STOP=1 -d lab_verify -f design_docs/schema.sql
          PGDATABASE=lab_verify python tests/check_verify_artifacts.py

      - name: MCP server tests (unit and integration)
        env:
          CARASLABDB_TEST_DB: lab_test
        run: python -m pytest -q mcp-server/tests

      - name: Live dashboard export has the expected shape
        env:
          PGDATABASE: lab_test   # holds the rows the MCP tests seeded
        run: python tests/check_lab_data.py

      - name: Live dashboard page is up to date with its generator
        run: |
          python web/live/build_live_page.py
          # The generator writes CRLF; the repository stores LF.
          sed -i 's/\r$//' web/live/lab-dashboard-live.html
          git diff --exit-code web/live/lab-dashboard-live.html

  # CI has no MATLAB, and Octave cannot run this code (no string type,
  # datetime, table, Database Toolbox or matlab.unittest). It can parse it,
  # so this is a syntax check only; see tests/check_matlab_syntax.py for what
  # is and is not covered.
  matlab-syntax:
    name: MATLAB syntax (Octave)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Octave
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends octave

      - name: Parse every MATLAB file
        run: python3 tests/check_matlab_syntax.py

  # The MATLAB class and GUI, run in MATLAB. The repository is public, so the
  # MathWorks actions license MATLAB and the Database Toolbox without a token
  # (a private repository would need a batch licensing token in
  # MLM_LICENSE_TOKEN). The PostgreSQL service lets the database-backed tests
  # run: tests/matlab/LabScratchDb.m creates and drops its own scratch
  # database. The GUI tests open uifigures, which need a display; Xvfb
  # provides one.
  matlab:
    name: MATLAB tests (${{ matrix.release }})
    # Pinned: MathWorks lists the Ubuntu versions each release supports, and
    # ubuntu-latest moves ahead of them.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        release: [R2025a]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      CARASLABDB_MTEST_ADMIN: postgres
      CARASLABDB_MTEST_ADMIN_PASSWORD: postgres
      CARASLABDB_MTEST_HOST: localhost
      CARASLABDB_MTEST_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      - name: Install the psql client and a virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client xvfb

      - name: Start the virtual display
        run: |
          Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.release }}
          products: Database_Toolbox
          cache: true

      # TEMPORARY diagnostics (to be removed before this is merged): what a
      # command started by MATLAB's system() sees, and a record of the
      # processes under MATLAB while the tests run.
      - name: "DIAG: watch the process tree"
        run: |
          nohup bash -c 'for i in $(seq 1 150); do { date -u +%T; ps -eo pid,ppid,stat,tty,etimes,args --forest | grep -v -e "ps -eo" -e "sleep 10"; } > /tmp/ps_snapshot.txt.new 2>&1; mv /tmp/ps_snapshot.txt.new /tmp/ps_snapshot.txt; sleep 10; done' >/dev/null 2>&1 &

      - name: Run the MATLAB tests
        uses: matlab-actions/run-command@v3
        timeout-minutes: 15
        with:
          command: addpath("tests"); run_matlab_tests

      - name: "DIAG: system() and psql from MATLAB"
        if: always()
        uses: matlab-actions/run-command@v3
        timeout-minutes: 5
        continue-on-error: true
        env:
          PGPASSWORD: postgres
        with:
          command: addpath("tests"); diag_system_probe

      - name: "DIAG: last process snapshot"
        if: always()
        run: |
          sed -n '1p' /tmp/ps_snapshot.txt || true
          grep -n -i -e matlab -e psql -e bash -e perl -e less -e pager -e " sh " -e env /tmp/ps_snapshot.txt | cut -c1-260 | tail -n 40 || true
