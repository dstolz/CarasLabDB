# Schema, privilege, live-dashboard, verifier and MCP server checks
# against every supported PostgreSQL major version. Nothing here needs MATLAB:
# the MATLAB tests in tests/matlab/ run locally only
# (design_docs/testing-locally.md).

name: tests
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the psql client and Python dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -e "mcp-server[test]" "ruff==0.15.20"

      - name: Lint Python
        run: ruff check mcp-server web/live web/forms tests tools

      - name: Apply schema.sql to a fresh database
        run: |
          createdb lab_test
          psql -X -q -v ON_ERROR_STOP=1 -d lab_test -f design_docs/schema.sql

      - name: Schema assertions
        run: psql -X -v ON_ERROR_STOP=1 -d lab_test -f tests/schema_test.sql

      - name: Grant script applies, twice
        run: |
          psql -X -q -v ON_ERROR_STOP=1 -d lab_test -f design_docs/grants.sql
          psql -X -q -v ON_ERROR_STOP=1 -d lab_test -f design_docs/grants.sql

      # schema_test.sql runs as the owner; this acts as members of lab_rw and
      # lab_ro, which is the only way to see what the grants actually allow.
      - name: Role and privilege assertions
        run: psql -X -v ON_ERROR_STOP=1 -d lab_test -f tests/roles_test.sql

      - name: Artifact verifier, end to end
        run: |
          createdb lab_verify
          psql -X -q -v ON_ERROR_STOP=1 -d lab_verify -f design_docs/schema.sql
          PGDATABASE=lab_verify python tests/check_verify_artifacts.py

      # Creates two throw-away logins, so it runs as the superuser, on a
      # database of its own with the schema and the grants.
      - name: Forms server, end to end
        run: |
          createdb lab_forms
          psql -X -q -v ON_ERROR_STOP=1 -d lab_forms -f design_docs/schema.sql -f design_docs/grants.sql
          PGDATABASE=lab_forms python tests/check_forms_server.py

      - name: MCP server tests (unit and integration)
        env:
          CARASLABDB_TEST_DB: lab_test
        run: python -m pytest -q mcp-server/tests

      - name: Live dashboard export has the expected shape
        env:
          PGDATABASE: lab_test   # holds the rows the MCP tests seeded
        run: python tests/check_lab_data.py

      - name: Live dashboard page is up to date with its generator
        run: |
          python web/live/build_live_page.py
          # The generator writes CRLF; the repository stores LF.
          sed -i 's/\r$//' web/live/lab-dashboard-live.html
          git diff --exit-code web/live/lab-dashboard-live.html

  # CI has no MATLAB, and Octave cannot run this code (no string type,
  # datetime, table, Database Toolbox or matlab.unittest). It can parse it,
  # so this is a syntax check only; see tests/check_matlab_syntax.py for what
  # is and is not covered.
  matlab-syntax:
    name: MATLAB syntax (Octave)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Octave
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends octave

      - name: Parse every MATLAB file
        run: python3 tests/check_matlab_syntax.py

  # The MATLAB class and GUI, run in MATLAB. The repository is public, so the
  # The MATLAB class and GUI, run in MATLAB (tests/matlab, about five minutes
  # per release). MathWorks actions license MATLAB and the Database Toolbox
  # without a token because the repository is public; a private repository
  # would need a batch licensing token in MLM_LICENSE_TOKEN. The PostgreSQL
  # service lets the database-backed tests run: tests/matlab/LabScratchDb.m
  # creates and drops its own scratch database. The GUI tests open uifigures,
  # which need a display; Xvfb provides one.
  matlab:
    name: MATLAB tests (${{ matrix.release }})
    # Pinned: MathWorks lists the Ubuntu versions each release supports, and
    # ubuntu-latest moves ahead of them.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # R2024b is the oldest release the class supports.
        release: [R2024b, R2025a, latest]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      CARASLABDB_MTEST_ADMIN: postgres
      CARASLABDB_MTEST_ADMIN_PASSWORD: postgres
      CARASLABDB_MTEST_HOST: localhost
      CARASLABDB_MTEST_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      - name: Install the psql client and a virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client xvfb

      - name: Start the virtual display
        run: |
          Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.release }}
          products: Database_Toolbox
          cache: true

      - name: Run the MATLAB tests
        uses: matlab-actions/run-command@v3
        timeout-minutes: 15
        with:
          command: addpath("tests"); run_matlab_tests
